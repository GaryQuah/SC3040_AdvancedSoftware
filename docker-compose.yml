services:
  # Python FastAPI Analytics & AI Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: endurance-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:3000
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Next.js 15 App Router Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: endurance-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy

  # Redis Message Queue for Asynchronous Activity Ingestion
  redis:
    image: redis:7-alpine
    container_name: endurance-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
